<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家悦K歌 · 播放端</title>
<script src="/vendor/hls.min.js"></script>
<script src="/vendor/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}

.wrap{position:fixed;inset:0;display:flex;flex-direction:column}

/* 主区：左侧视频 + 右侧已点列表 */
.main{flex:1;display:flex;min-height:0}
.video-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
#player{width:100%;height:100%;object-fit:contain;display:block}
#idle{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(1000px 520px at 50% 30%,rgba(199,54,247,.14),transparent 70%),#000;z-index:1}
#idle .logo{font-size:46px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,#36d9f7,#c736f7,#ff4f9b);-webkit-background-clip:text;background-clip:text;color:transparent}
#idle .tip{font-size:20px;color:#9a9ab8;letter-spacing:3px}
#idle .sub{font-size:14px;color:#5d5d7a}

/* 右侧已点列表（窄列） */
#queue-panel{
  width:330px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;
  background:rgba(8,6,20,.92);border-left:1px solid rgba(255,255,255,.08)}
#qp-head{padding:14px 16px;font-size:15px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03)}
#qp-head .dot{width:8px;height:8px;border-radius:50%;background:#ff4f9b;box-shadow:0 0 10px #ff4f9b}
#qp-count{font-size:12px;color:#8a8aad;font-weight:400;margin-left:auto}
#qp-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:#3a3a5c transparent}
.qitem{padding:9px 10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:9px}
.qitem.playing{background:rgba(199,54,247,.16);border-color:rgba(199,54,247,.5)}
.qitem .qn{font-size:12px;color:#8a8aad;width:20px;text-align:center;flex-shrink:0}
.qitem.playing .qn{color:#c736f7;font-weight:700}
.qitem .qi{flex:1;min-width:0}
.qitem .qt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qm{font-size:11px;color:#8a8aad;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qops{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.qitem .qop{width:26px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#c8c8e8;font-size:12px;cursor:pointer;line-height:1;padding:0}
.qitem .qop:hover{background:rgba(199,54,247,.35);border-color:#c736f7}
.qitem .qop.del:hover{background:rgba(255,79,155,.35);border-color:#ff4f9b}

/* 底部控制条 */
#controlbar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;flex-wrap:wrap;
  padding:10px 16px;background:rgba(8,6,20,.95);border-top:1px solid rgba(255,255,255,.08)}
/* 进度条（常驻、不自动隐藏）：控制栏第一行全宽，支持拖拽 seek */
#seekbar{
  width:100%;display:flex;align-items:center;gap:10px;padding:2px 4px 10px;flex-wrap:nowrap}
#seekbar.hide{display:none}
#sb-cur,#sb-dur{font-size:12px;color:#9b9bc0;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:46px;text-align:center}
#sb-track{
  flex:1 1 auto;height:14px;border-radius:7px;background:rgba(255,255,255,.10);
  position:relative;cursor:pointer;touch-action:none}
#sb-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:7px;
  background:linear-gradient(90deg,#ff4f9b,#c736f7,#36d9f7)}
#sb-thumb{
  position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5);
  border:2px solid #c736f7;display:none}
#seekbar:hover #sb-thumb,#seekbar.drag #sb-thumb{display:block}
#sb-track:active{cursor:grabbing}
/* 随机开关状态：ON/OFF 角标 + 文字变化，电视远看也清楚 */
#cb-random{position:relative}
#cb-random .rtxt{font-size:12px;font-weight:700}
#cb-random .rbadge{
  position:absolute;top:-4px;right:-4px;font-size:9px;font-weight:800;line-height:1.4;
  padding:1px 5px;border-radius:8px;background:#22c55e;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#cb-random:not(.on) .rbadge{background:#5b5b74;color:#cfcfe6}
#cb-random.on .rbadge{animation:rndpulse 1.6s ease-in-out infinite}
@keyframes rndpulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.cbtn{
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;
  flex:0 0 auto; /* 禁止 flex 拉伸/收缩，宽度严格按 min-width */
  padding:7px 12px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);font-size:11px;color:#dcdcf2;transition:.15s}
.cbtn:hover{background:rgba(199,54,247,.22);border-color:rgba(199,54,247,.5);transform:translateY(-2px)}
.cbtn:active{transform:scale(.94)}
.cbtn .ci{font-size:19px;line-height:1}
.cbtn.on{background:linear-gradient(135deg,rgba(255,79,155,.55),rgba(199,54,247,.55));border-color:#ff4f9b;color:#fff}
.cbtn.main{background:linear-gradient(135deg,#c736f7,#36d9f7);border-color:transparent;color:#0a0420;font-weight:700}
.cbtn.main .ci{color:#0a0420}

/* 全屏状态：队列面板隐藏；控制栏悬浮于视频下方，无操作自动隐藏、有操作恢复（类似视频网站） */
body.fs #queue-panel{display:none}
body.fs #controlbar{
  position:fixed;left:0;bottom:0;width:100%;z-index:50;
  background:linear-gradient(180deg,transparent,rgba(8,6,20,.88) 30%);
  border-top:none;padding-bottom:14px;
  transition:opacity .35s ease, transform .35s ease}
body.fs #controlbar.hide-ui{opacity:0;transform:translateY(26px);pointer-events:none}
/* 随机开关状态提示浮层 */
#random-tip{position:fixed;bottom:24%;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(8,6,20,.92);border:1px solid rgba(255,255,255,.2);border-radius:12px;
  padding:14px 26px;font-size:22px;color:#fff;display:none;text-align:center;white-space:nowrap;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#random-tip.show{display:block}
#random-tip b{color:#ff4f9b}

/* 正在播放/下一曲 顶部滚动条：KTV 风格，全宽从最右滚到最左，10~20 秒一次 */
#ticker{
  position:fixed;top:1.5vh;left:0;width:100%;height:6vh;overflow:hidden;
  z-index:40;pointer-events:none;white-space:nowrap;display:none;
  background:linear-gradient(90deg,rgba(10,8,25,.68),rgba(35,18,60,.58) 35%,rgba(10,8,25,.68));
  border-top:1px solid rgba(199,54,247,.45);
  border-bottom:1px solid rgba(199,54,247,.45);
  box-shadow:0 2px 14px rgba(0,0,0,.55)}
#ticker.show{display:block}
#ticker-inner{
  height:6vh;line-height:6vh;padding:0 2vw;font-size:2.7vh;font-weight:600;
  letter-spacing:.5px;color:#fff;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.6)}
#ticker-inner .tk-playing{color:#ffe08a}
#ticker-inner .tk-next{color:#7dffb0}
#ticker-inner .tk-welcome{color:#fff3c4;letter-spacing:1.5px;font-weight:700}
/* KTV 滚动：从屏幕最右进、最左出，跑完一次即止 */
#ticker-inner.go{animation:tickerRun 25s linear forwards}
@keyframes tickerRun{
  from{transform:translateX(100vw)}
  to{transform:translateX(-100%)}
}

#conn{
  position:fixed;top:14px;right:350px;z-index:20;font-size:12px;color:#777;
  padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.05);transition:right .2s}
body.fs #conn{right:18px}
#conn.on{color:#7dffb0;background:rgba(61,220,132,.12)}
#effect-toast{
  position:fixed;top:14%;left:50%;transform:translate(-50%,-20px);
  background:rgba(20,24,34,.85);border:1px solid rgba(255,255,255,.28);
  color:#fff;font-size:34px;padding:14px 40px;border-radius:44px;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 8px 30px rgba(0,0,0,.45);letter-spacing:1px}
#effect-toast.show{opacity:1;transform:translate(-50%,0)}
#effect-tip{
  position:fixed;top:26%;left:50%;transform:translate(-50%,-10px);
  background:rgba(120,80,0,.85);border:1px solid rgba(255,200,80,.6);
  color:#ffe08a;font-size:26px;padding:12px 32px;border-radius:36px;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 8px 30px rgba(0,0,0,.45);letter-spacing:1px}
#effect-tip.show{opacity:1;transform:translate(-50%,0)}
/* 扫码：控制条按钮触发，二维码卡片固定在右上角（常驻，点按钮切换） */
#scan-pop{
  position:fixed;top:66px;right:350px;z-index:30;display:none;width:220px;
  background:rgba(14,12,32,.96);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:16px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:right .2s}
#scan-pop.show{display:block}
body.fs #scan-pop{right:18px}
@media (max-width:700px){#scan-pop{right:14px}}
#scan-pop .st{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px}
#scan-qr{width:150px;height:150px;margin:0 auto;background:#fff;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
#scan-qr canvas,#scan-qr img{display:block;width:100%!important;height:100%!important}
#scan-url{font-size:11px;color:#9a9ab8;margin-top:10px;word-break:break-all;user-select:all}
#scan-pop .sc{font-size:11px;color:#6d6d8e;margin-top:4px}
/* 均衡器预设面板：与控制条同排右侧，点选即生效 */
#eq-pop{
  position:fixed;top:66px;right:350px;z-index:30;display:none;width:230px;
  background:rgba(14,12,32,.96);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:16px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:right .2s}
#eq-pop.show{display:block}
body.fs #eq-pop{right:18px}
@media (max-width:700px){#eq-pop{right:14px}}
#eq-pop .st{font-size:14px;font-weight:700;color:#fff;margin-bottom:12px}
#eq-presets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.eqp{padding:10px 0;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#dcdcf2;font-size:13px;cursor:pointer;transition:.15s}
.eqp:hover{background:rgba(199,54,247,.3);border-color:#c736f7}
.eqp.on{background:linear-gradient(135deg,rgba(255,79,155,.5),rgba(199,54,247,.5));border-color:#ff4f9b;color:#fff;font-weight:700}
#eq-pop .sc{font-size:11px;color:#6d6d8e;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="video-wrap">
      <video id="player" playsinline autoplay></video>
      <div id="idle">
        <div class="logo">家悦K歌</div>
        <div class="tip">播放端已就绪</div>
        <div class="sub">请在点歌台 / 手机端点歌，这里会自动开始播放</div>
      </div>
    </div>

    <div id="queue-panel">
      <div id="qp-head"><span class="dot"></span>已点列表<span id="qp-count">0 首</span></div>
      <div id="qp-list"></div>
    </div>
  </div>

  <div id="controlbar">
    <div id="seekbar" class="hide">
      <span id="sb-cur">00:00</span>
      <div id="sb-track"><div id="sb-fill"></div><div id="sb-thumb"></div></div>
      <span id="sb-dur">00:00</span>
    </div>
    <div class="cbtn" id="cb-play" onclick="togglePlay()"><span class="ci">⏸</span>暂停</div>
    <div class="cbtn" id="cb-voice" onclick="toggleVoice()"><span class="ci">🎤</span>原/伴唱</div>
    <div class="cbtn" onclick="doRepeat()"><span class="ci">🔄</span>重唱</div>
    <div class="cbtn" onclick="doNext()"><span class="ci">⏭</span>切歌</div>
    <div class="cbtn" onclick="doVolume(-1)"><span class="ci">🔉</span>音量-</div>
    <div class="cbtn" onclick="doVolume(1)"><span class="ci">🔊</span>音量+</div>
    <div class="cbtn" id="cb-eq" onclick="eqTip()"><span class="ci">🎛</span>均衡器</div>
    <div class="cbtn" onclick="toggleFullscreen()"><span class="ci">⛶</span>全屏</div>
    <div class="cbtn" id="cb-scan" onclick="toggleScan()"><span class="ci">📱</span>扫码</div>
    <div class="cbtn" id="cb-random" onclick="toggleRandom()"><span class="ci">🔀</span>随机</div>
  </div>
</div>

<div id="scan-pop">
  <div class="st">手机扫码点歌</div>
  <div id="scan-qr"></div>
  <div id="scan-url"></div>
  <div class="sc">再点扫码图标关闭</div>
</div>

<!-- 均衡器预设面板（KTV 场景预设，无需手动调） -->
<div id="eq-pop">
  <div class="st">均衡器预设</div>
  <div id="eq-presets">
    <button class="eqp" data-eq="flat" onclick="applyPreset('flat')">原声</button>
    <button class="eqp" data-eq="pop" onclick="applyPreset('pop')">流行</button>
    <button class="eqp" data-eq="rock" onclick="applyPreset('rock')">摇滚</button>
    <button class="eqp" data-eq="dance" onclick="applyPreset('dance')">舞曲</button>
    <button class="eqp" data-eq="vocal" onclick="applyPreset('vocal')">人声</button>
    <button class="eqp" data-eq="diy" onclick="applyPreset('diy')">DIY</button>
  </div>
  <div class="sc">点选即生效，再点均衡器图标关闭</div>
</div>

<div id="conn" class="off">连接中…</div>

<!-- 顶部滚动条：正在播放/下一曲，15~30 秒出现一次，跑完消失 -->
<div id="ticker"><div id="ticker-inner"></div></div>

<script>
const player=document.getElementById('player');
const idleEl=document.getElementById('idle');
const connEl=document.getElementById('conn');
let ws=null, queueData=[], currentQueueId=null, currentSongId=null, voiceMode='original', wsTimer=null;

function connectWS(){
  const proto=location.protocol==='https:'?'wss://':'ws://';
  ws=new WebSocket(proto+location.host+'/ws');
  ws.onopen=()=>{ connEl.textContent='播放端在线'; connEl.classList.add('on'); };
  ws.onmessage=(ev)=>{
    let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type==='queue'&&msg.data){ queueData=msg.data; handleQueue(); }
    if(msg.type==='control') handleControl(msg.action, msg);
    if(msg.type==='effect') playEffect(msg.effect, msg.nickname);
  };
  ws.onclose=()=>{ connEl.textContent='已断开，重连中…'; connEl.classList.remove('on');
    clearTimeout(wsTimer); wsTimer=setTimeout(connectWS,2500); };
}
connectWS();

// 全屏切换：进入全屏隐藏列表与控制条，退出恢复
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('fs', !!document.fullscreenElement);
});

const tickerEl=document.getElementById('ticker');
const tickerInner=document.getElementById('ticker-inner');
let tickerTimer=null, tickerStep='song', welcomeMsg='家悦K歌，唱响每一刻';
// 拉取后台设置的欢迎语
fetch('/api/welcome').then(r=>r.json()).then(d=>{ if(d && d.welcome) welcomeMsg=d.welcome; }).catch(()=>{});
function renderTicker(){
  if(!tickerInner) return;
  const p=queueData.find(q=>q.status==='playing');
  const n=queueData.find(q=>q.status==='waiting');
  const parts=[];
  if(p){ parts.push(`<span class="tk-playing">▶ 正在播放：${esc(p.title)}　${esc(p.artist||'')}</span>`); }
  else { parts.push(`<span class="tk-playing">▶ 请点歌</span>`); }
  if(n){ parts.push(`<span class="tk-next">⏭ 下一曲：${esc(n.title)}　${esc(n.artist||'')}</span>`); }
  else { parts.push(`<span class="tk-next">⏭ 下一曲：请点歌</span>`); }
  tickerInner.innerHTML=parts.join('<span style="opacity:.4;margin:0 14px">│</span>');
}
function showTicker(){
  if(!tickerEl||!tickerInner) return;
  tickerStep='song';
  renderTicker(); // 先滚歌曲播报
  // 每次滚动前刷新欢迎语，后台改了不用刷新页面
  fetch('/api/welcome').then(r=>r.json()).then(d=>{ if(d && d.welcome) welcomeMsg=d.welcome; }).catch(()=>{});
  tickerEl.classList.add('show');
  restartTickerAnim();
}
function restartTickerAnim(){
  tickerInner.classList.remove('go');
  void tickerInner.offsetWidth; // 强制 reflow，确保动画每次重新触发
  tickerInner.classList.add('go');
}
function renderWelcomeTicker(){
  tickerInner.innerHTML=`<span class="tk-welcome">${esc(welcomeMsg)}</span>`;
}
function scheduleTicker(){
  clearTimeout(tickerTimer);
  // 10~20 秒随机间隔出现一次
  tickerTimer=setTimeout(showTicker, 10000+Math.random()*10000);
}
if(tickerInner){
  tickerInner.addEventListener('animationend', (e)=>{
    if(e.animationName!=='tickerRun') return;
    if(tickerStep==='song'){
      // 歌曲播报播完，接着滚动欢迎语
      tickerStep='welcome';
      renderWelcomeTicker();
      restartTickerAnim();
    } else {
      // 欢迎语播完，隐藏并等下一次
      tickerEl.classList.remove('show');
      tickerInner.classList.remove('go');
      scheduleTicker();
    }
  });
  scheduleTicker();
}

function handleQueue(){
  renderQueue();
  renderTicker();
  const playing=queueData.find(q=>q.status==='playing');
  if(playing){
    idleEl.style.display='none';
    currentDur=playing.duration||0;
    if(currentQueueId!==playing.queue_id||currentSongId!==playing.song_id){
      currentQueueId=playing.queue_id; currentSongId=playing.song_id;
      voiceMode='original'; // 新歌默认原唱
      loadPlayer(`/hls/${playing.song_id}/master.m3u8`);
    }
    updateSeekbar();
  }else{
    idleEl.style.display='flex';
    if(!player.paused) player.pause();
    currentQueueId=null; currentSongId=null; currentDur=0;
    updateSeekbar();
    maybeRandomPlay(); // 本地空闲随机：队列空且开关开时随机点一首
  }
}

// 用 hls.js 播放 HLS（Chrome/Edge 不支持原生 HLS，且原生 audioTracks 切换无效；
// 切换音轨必须走 hls.audioTrack）。
// 播放降级链：hls.js(MSE) → 原生 HLS(m3u8，安卓/电视浏览器普遍支持) → /stream 直出流。
// 网络/媒体错误最多重试 3 次，仍失败则降级，避免无限重试导致"一直不播放"。
let hls = null, hlsErr = 0;
function loadPlayer(url){
  if(hls){ hls.destroy(); hls=null; }
  hlsErr = 0;
  if(window.Hls && Hls.isSupported()){
    // 渐进式转码的 event playlist 转码完成前没有 ENDLIST，hls.js 会当 live 流
    // 从 live edge（末尾）起播 → 首次播放从中间开始。startPosition:0 强制从头，
    // liveSyncDuration 设极大值禁用"落后过多跳回 live edge"，保证渐进转码期间稳定从头播。
    hls = new Hls({enableWorker:true, lowLatencyMode:false, startPosition:0, liveSyncDuration:Number.MAX_SAFE_INTEGER});
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ hlsErr=0; player.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR, (ev, data)=>{
      if(!(data && data.fatal)) return;
      switch(data.type){
        case Hls.ErrorTypes.NETWORK_ERROR:
          if(hlsErr < 3){ hlsErr++; hls.startLoad(); } else { fallbackStream(); }
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          if(hlsErr < 3){ hlsErr++; hls.recoverMediaError(); } else { fallbackStream(); }
          break;
        default: fallbackStream();
      }
    });
  } else {
    playNativeHLS(url);
  }
}
function playNativeHLS(url){

// ===== 互动氛围音效（Web Audio 合成，无需音频文件）：手机端发送 effect 消息触发 =====
let _actx=null;
function getAudioCtx(){ if(!_actx){ _actx=new (window.AudioContext||window.webkitAudioContext)(); } return _actx; }
async function ensureAudio(){
  const ctx=getAudioCtx(); if(!ctx) return false;
  if(ctx.state==='suspended'){ try{ await ctx.resume(); }catch(e){} }
  return ctx.state==='running';
}
// 浏览器自动播放限制：首次点击/按键/触摸大屏即解锁音效（KTV场景下，大屏被按过遥控OK键
// 或点过一次屏幕后，后续所有氛围音效都能正常出声；播放歌曲时音频通道已解锁也会顺带恢复）
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{
  ensureAudio().then(ok=>{
    if(ok){ const tip=document.getElementById('effect-tip');
      if(tip){ tip.textContent='🔊 音效已开启'; tip.classList.add('show'); clearTimeout(tip._tm);
        tip._tm=setTimeout(()=>tip.classList.remove('show'),1600); } }
  });
},{once:true}));
function effectNoise(ctx,dur){
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return buf;
}
// 优先播放真实音效文件（web/tv/sfx/<name>.mp3 / .wav），不存在或失败回退 Web Audio 合成。
// 文件命名：cheer.mp3(欢呼) applause.mp3(鼓掌) scream.mp3(尖叫) whistle.mp3(口哨)
//            boo.mp3(喝倒彩) encore.mp3(再来一首)，支持 mp3 / wav 任选其一。
function playSfxFile(name){
  return new Promise(resolve=>{
    let tried=0;
    const tryNext=()=>{
      tried++;
      const ext=tried===1?'mp3':(tried===2?'wav':null);
      if(!ext){ resolve(false); return; }
      const a=new Audio(`/tv/sfx/${name}.${ext}`);
      a.volume=0.95;
      const fail=()=>{ a.onplay=null; a.onerror=null; tryNext(); };
      a.onerror=fail;
      a.onplay=()=>{ a.onplay=null; a.onerror=null; a.onended=()=>resolve(true); };
      a.play().catch(fail);
    };
    tryNext();
  });
}
async function playEffect(name,by){
  const ctx=getAudioCtx(); if(!ctx) return;
  const label={cheer:'欢呼',applause:'鼓掌',scream:'尖叫',whistle:'口哨',boo:'喝倒彩',encore:'再来一首'}[name]||name;
  showEffectToast(by||'匿名歌手',label);
  const ok=await ensureAudio();
  if(!ok){
    // 浏览器自动播放限制拦截了音效：提示用户在大屏上点一次屏幕/遥控OK键即可开启
    let tip=document.getElementById('effect-tip');
    if(!tip){ tip=document.createElement('div'); tip.id='effect-tip'; document.body.appendChild(tip); }
    tip.textContent='⚠️ 音效被浏览器拦截：请在大屏上点击一次屏幕开启音效';
    tip.classList.remove('show'); void tip.offsetWidth; tip.classList.add('show');
    clearTimeout(tip._tm); tip._tm=setTimeout(()=>tip.classList.remove('show'),3600);
    return;
  }
  const usedFile=await playSfxFile(name);
  if(usedFile) return;
  const t=ctx.currentTime;
  switch(name){
    case 'cheer':{
      const src=ctx.createBufferSource(); src.buffer=effectNoise(ctx,2.8);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1000; bp.Q.value=0.6;
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7,t+0.25);
      const lfo=ctx.createOscillator(); lfo.frequency.value=7;
      const lg=ctx.createGain(); lg.gain.value=0.2; lfo.connect(lg); lg.connect(g.gain);
      g.gain.exponentialRampToValueAtTime(0.5,t+2.6); g.gain.exponentialRampToValueAtTime(0.0001,t+2.8);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t); lfo.start(t); src.stop(t+2.85); lfo.stop(t+2.85); break;
    }
    case 'applause':{
      const n=Math.floor(28+Math.random()*36);
      for(let i=0;i<n;i++){
        const st=t+Math.random()*2.2;
        const src=ctx.createBufferSource(); src.buffer=effectNoise(ctx,0.06);
        const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
        const g=ctx.createGain(); g.gain.setValueAtTime(0.45*Math.random()+0.18,st);
        g.gain.exponentialRampToValueAtTime(0.001,st+0.045);
        src.connect(hp); hp.connect(g); g.connect(ctx.destination);
        src.start(st); src.stop(st+0.07);
      } break;
    }
    case 'scream':{
      const src=ctx.createOscillator(); src.type='sawtooth';
      src.frequency.setValueAtTime(700,t); src.frequency.exponentialRampToValueAtTime(1500,t+0.5);
      const vib=ctx.createOscillator(); vib.frequency.value=9; const vg=ctx.createGain(); vg.gain.value=70;
      vib.connect(vg); vg.connect(src.frequency);
      const n=ctx.createBufferSource(); n.buffer=effectNoise(ctx,1.1);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=1;
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.42,t+0.1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
      src.connect(g); n.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t); vib.start(t); n.start(t); src.stop(t+1.15); vib.stop(t+1.15); n.stop(t+1.15); break;
    }
    case 'whistle':{
      const src=ctx.createOscillator(); src.type='sine';
      src.frequency.setValueAtTime(2300,t); src.frequency.exponentialRampToValueAtTime(3000,t+0.25);
      src.frequency.exponentialRampToValueAtTime(2500,t+0.7);
      const vib=ctx.createOscillator(); vib.frequency.value=11; const vg=ctx.createGain(); vg.gain.value=35;
      vib.connect(vg); vg.connect(src.frequency);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.08); g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
      src.connect(g); g.connect(ctx.destination);
      src.start(t); vib.start(t); src.stop(t+0.8); vib.stop(t+0.8); break;
    }
    case 'boo':{
      const src=ctx.createOscillator(); src.type='sawtooth';
      src.frequency.setValueAtTime(180,t); src.frequency.exponentialRampToValueAtTime(85,t+0.7);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
      const n=ctx.createBufferSource(); n.buffer=effectNoise(ctx,1.2);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.12); g.gain.exponentialRampToValueAtTime(0.0001,t+1.15);
      src.connect(lp); lp.connect(g); n.connect(g); g.connect(ctx.destination);
      src.start(t); n.start(t); src.stop(t+1.2); n.stop(t+1.2); break;
    }
    case 'encore':{
      [660,880].forEach((f,i)=>{
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g=ctx.createGain(); const st=t+i*0.12;
        g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.4,st+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,st+0.5);
        o.connect(g); g.connect(ctx.destination); o.start(st); o.stop(st+0.55);
      }); break;
    }
  }
}

function handleControl(action, msg){
  switch(action){
    case 'play_pause':
      if(player.paused){ player.play(); } else { player.pause(); }
      sendState(); break;
    case 'voice': toggleVoice(); break;
    case 'repeat':
      try{ if(player.readyState>=1) player.currentTime=0; }catch(e){}
      player.play().catch(()=>{}); sendState(); break;
    case 'next': fetch('/api/queue/next',{method:'POST'}).catch(()=>{}); break;
    case 'volume_up': player.volume=Math.min(1,player.volume+0.1); break;
    case 'volume_down': player.volume=Math.max(0,player.volume-0.1); break;
    case 'eq':
      if(msg && msg.gains) applyEQ(msg.gains);
      // 远端（PAD）手调 DIY：更新 DIY 值并同步选择；选固定预设则只同步高亮
      if(msg && msg.gains){
        if(msg.preset==='diy' || !msg.preset){
          eqPresets.diy = (msg.gains||[]).map(g=>parseFloat(g)||0);
          try{ localStorage.setItem(EQ_STORAGE,'diy'); }catch(e){}
          syncEqButtons();
        } else if(msg.preset && eqPresets[msg.preset]){
          try{ localStorage.setItem(EQ_STORAGE,msg.preset); }catch(e){}
          syncEqButtons();
        }
      }
      break;
    // home/fullscreen/ok/focus_* 已随手机端遥控入口下线，不再处理
  }
}

// ---------- 均衡器（Web Audio，10 段 peaking） ----------
let audioCtx=null, eqFilters=[];
function initEQ(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaElementSource(player);
    const freqs=[60,170,310,600,1000,3000,6000,12000,14000,16000];
    let prev=src;
    freqs.forEach(f=>{
      const flt=audioCtx.createBiquadFilter();
      flt.type='peaking'; flt.frequency.value=f; flt.Q.value=1.1; flt.gain.value=0;
      prev.connect(flt); prev=flt; eqFilters.push(flt);
    });
    prev.connect(audioCtx.destination);
  }catch(e){ console.error('EQ init failed', e); }
}
function applyEQ(gains){
  initEQ();
  if(!eqFilters.length) return;
  (gains||[]).forEach((g,i)=>{ if(eqFilters[i]) eqFilters[i].gain.value = parseFloat(g)||0; });
}

}

// ===== 进度条（常驻、不自动隐藏，支持拖拽 seek） =====
let currentDur=0, sbDragging=false;
function fmtTime(s){
  s=Math.max(0,Math.floor(s||0));
  const m=Math.floor(s/60), ss=s%60;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}
function updateSeekbar(){
  const sb=document.getElementById('seekbar');
  if(!currentQueueId||!currentSongId){ sb.classList.add('hide'); return; }
  sb.classList.remove('hide');
  let dur=currentDur;
  if(!dur||!isFinite(dur)){ const d=player.duration; if(d&&isFinite(d)) dur=d; }
  const cur=player.currentTime||0;
  document.getElementById('sb-cur').textContent=fmtTime(cur);
  document.getElementById('sb-dur').textContent=fmtTime(dur||0);
  const pct=dur>0?Math.min(100,cur/dur*100):0;
  document.getElementById('sb-fill').style.width=pct+'%';
  document.getElementById('sb-thumb').style.left=pct+'%';
}
player.addEventListener('timeupdate',()=>{ if(!sbDragging) updateSeekbar(); });
setInterval(()=>{ if(!sbDragging) updateSeekbar(); },2000);

(function initSeekbar(){
  const tr=document.getElementById('sb-track');
  if(!tr) return;
  function posToSec(e){
    const r=tr.getBoundingClientRect();
    const x=(e.clientX||r.left)-r.left;
    const pct=Math.max(0,Math.min(1,x/r.width));
    let dur=currentDur;
    if(!dur||!isFinite(dur)){ const d=player.duration; if(d&&isFinite(d)) dur=d; }
    return {pct, sec:(dur||0)*pct};
  }
  function paint(pct,sec){
    document.getElementById('sb-fill').style.width=(pct*100)+'%';
    document.getElementById('sb-thumb').style.left=(pct*100)+'%';
    document.getElementById('sb-cur').textContent=fmtTime(sec);
  }
  tr.addEventListener('pointerdown',e=>{
    if(!currentQueueId) return;
    sbDragging=true;
    tr.classList.add('drag');
    const {pct,sec}=posToSec(e);
    paint(pct,sec);
    if(tr.setPointerCapture) tr.setPointerCapture(e.pointerId);
  });
  tr.addEventListener('pointermove',e=>{
    if(!sbDragging) return;
    const {pct,sec}=posToSec(e);
    paint(pct,sec);
  });
  function endDrag(e){
    if(!sbDragging) return;
    sbDragging=false;
    tr.classList.remove('drag');
    const {sec}=posToSec(e);
    seekTo(sec);
  }
  tr.addEventListener('pointerup',endDrag);
  tr.addEventListener('pointercancel',()=>{ sbDragging=false; tr.classList.remove('drag'); });
})();

function seekTo(sec){
  if(!currentSongId||sec<0) return;
  if(hls){
    // HLS：已转码部分可即时跳转，未转码部分等转码跟上
    try{ player.currentTime=sec; player.play().catch(()=>{}); }catch(e){}
  } else if(player.src&&player.src.includes('/stream/')&&/[?&]track=/.test(player.src)){
    // 直连转码流（多音轨/strm 指定轨）：不支持 Range，带 start 重新请求
    const base=player.src.split('?')[0];
    const m=player.src.match(/[?&]track=(\d+)/);
    const qs='track='+(m?m[1]:'')+'&start='+Math.round(sec*1000);
    player.src=base+'?'+qs;
    player.play().catch(()=>{});
  } else {
    // 直连单音轨（Range）/原生：直接 currentTime
    try{ player.currentTime=sec; player.play().catch(()=>{}); }catch(e){}
  }
}

// 队列空 + 开关开：本地随机点一首（排除已在队列中的歌）
let randomBusy=false, lastRandomAt=0;
async function maybeRandomPlay(){
  if(!randomOn||randomBusy) return;
  const now=Date.now();
  if(now-lastRandomAt<4000) return; // 防抖，避免重复触发
  // 二次确认队列真的空（WS 广播可能延迟）
  try{
    const q=await (await fetch('/api/queue')).json();
    const list=Array.isArray(q)?q:(q&&q.data?q.data:[]);
    if(list.some(e=>e.status==='playing'||e.status==='waiting')) return;
  }catch(e){ return; }
  randomBusy=true;
  try{
    const songs=await (await fetch('/api/songs')).json();
    const arr=Array.isArray(songs)?songs:(songs&&songs.data?songs.data:[]);
    if(!arr.length){ return; }
    const taken=new Set((queueData||[]).map(x=>x.song_id));
    const pool=arr.filter(s=>!taken.has(s.id));
    const src=pool.length?pool:arr;
    const pick=src[Math.floor(Math.random()*src.length)];
    if(pick){
      lastRandomAt=Date.now();
      await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({song_id:pick.id,nickname:'随机播放'})});
    }
  }catch(e){} finally{ randomBusy=false; }
}
setRandomUI(randomState());

// ===== 全屏控制栏悬浮自动隐藏（无操作 4 秒隐藏，有操作恢复） =====
let fsHideTimer=null;
function scheduleFsHide(){
  const cbar=document.getElementById('controlbar');
  cbar.classList.remove('hide-ui');
  clearTimeout(fsHideTimer);
  fsHideTimer=setTimeout(()=>{
    if(document.fullscreenElement) cbar.classList.add('hide-ui');
  },4000);
}
document.addEventListener('fullscreenchange',()=>{
  const cbar=document.getElementById('controlbar');
  if(document.fullscreenElement){
    cbar.classList.remove('hide-ui');
    scheduleFsHide();
  } else {
    clearTimeout(fsHideTimer);
    cbar.classList.remove('hide-ui');
  }
});
['mousemove','pointerdown','keydown','touchstart'].forEach(ev=>{
  document.addEventListener(ev,()=>{ if(document.fullscreenElement) scheduleFsHide(); });
});
player.addEventListener('pause',sendState);
player.addEventListener('play',sendState);
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ============ 扫码 ============
let scanInited=false;
function toggleScan(){
  const btn=document.getElementById('cb-scan');
  const pop=document.getElementById('scan-pop');
  const show=!pop.classList.contains('show');
  if(show){
    if(!scanInited){
      const url=location.protocol+'//'+location.host+'/m/';
      const box=document.getElementById('scan-qr');
      box.innerHTML='';
      if(window.QRCode){
        new QRCode(box, {text:url, width:150, height:150, colorDark:'#12052c', colorLight:'#ffffff'});
      }else{
        box.textContent='二维码组件不可用，请直接访问：'+url;
      }
      document.getElementById('scan-url').textContent=url;
      scanInited=true;
    }
    pop.classList.add('show');
    btn.classList.add('on');
  }else{
    pop.classList.remove('show');
    btn.classList.remove('on');
  }
}
