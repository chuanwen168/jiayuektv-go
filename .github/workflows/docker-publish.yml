name: Docker 镜像构建推送 (GHCR + Docker Hub)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签（如 1.0.2）'
        required: true
        default: '1.0.2'
  push:
    tags: ['v*']

env:
  IMG_GHCR: ghcr.io/chuanwen168/jiayuektv-go
  IMG_DOCKERHUB: docker.io/chuanwen168/jiayuektv-go

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设定版本号与推送目标
        id: ver
        env:
          DHU: ${{ secrets.DOCKERHUB_USERNAME }}
          DHT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ver=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          TAGS="${{ env.IMG_GHCR }}:${{ steps.ver.outputs.ver }}\n${{ env.IMG_GHCR }}:latest"
          if [ -n "$DHU" ] && [ -n "$DHT" ]; then
            TAGS="$TAGS\n${{ env.IMG_DOCKERHUB }}:${{ steps.ver.outputs.ver }}\n${{ env.IMG_DOCKERHUB }}:latest"
            echo "Docker Hub 双推: 已启用"
          else
            echo "Docker Hub 双推: 未配置 secrets，仅推 GHCR"
          fi
          printf "%b" "$TAGS" > /tmp/tags.txt
          { echo "tags<<EOF"; cat /tmp/tags.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
