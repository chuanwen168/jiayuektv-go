services:
  jiayue-ktv:
    # image: ghcr.io/chuanwen168/jiayuektv-go:latest  # 海外源；想用指定版本可改成指定版本比如1.0.5
    image: ccr.ccs.tencentyun.com/chuanwen168/jiayuektv-go:latest   # 国内源（腾讯云），任选其一，推荐腾讯云，国内拉取快
    container_name: jiayue-ktv
    restart: unless-stopped
    ports:
      - "8086:8080"          # 访问端口：http://局域网IP:8086
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - DATA_DIR=/data
      - ADMIN_PASSWORD=admin888          # 管理后台("/admin")登录密码，建议立即修改
      - VAAPI_DEVICE=/dev/dri/renderD128 # 核显硬件转码用，没有核显就删掉这行。非核显，需要换成指定挂载点
      - HLS_CACHE_MAX_AGE_DAYS=3         # 转码缓存超过几天没人点就自动清理
    volumes:
      - ./data:/data                 # 应用数据(数据库、封面等)，必须挂载
      # 曲库挂载：本地曲库挂到 /mv/<自定义名>，网盘曲库挂到 /mv-net/<自定义名>
      - ./mv:/mv/library1            # 把歌曲放进 ./mv 目录（可建子文件夹分类）mv/国语，mv/粤语，可以挂载多文件
      - ./singer:/singer             # 歌手头像目录，图片名对应歌手名，如 周杰伦.jpg
      # 挂载完成后，还需要去后台「曲库管理→曲库来源」里把新目录逐个启用，才会真正参与扫描
    devices:
      - /dev/dri:/dev/dri            # 核显硬件转码用，没有核显就删掉这行，非核显，需要换成指定挂载点
